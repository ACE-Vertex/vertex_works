[package]
name = "vertex-receiver"
version = "0.5.0"
description = "AI Artifact Ingress for Vertex World"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = "2"
vertex-vlac-types = { path = "../../vertex_llm_access_connector/crates/vlac-types" }
vertex-vlac-core = { path = "../../vertex_llm_access_connector/crates/vlac-core" }
vertex-vlac-flow-rack = { path = "../../vertex_llm_access_connector/crates/vlac-flow-rack" }
vertex-vlac-works-unit = { path = "../../vertex_llm_access_connector/crates/vlac-works-unit" }

[profile.release]
strip = true
lto = true
codegen-units = 1
